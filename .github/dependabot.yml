# Weekly pull requests for new versions; CI tests each one. Minor and patch
# updates come grouped, one pull request per ecosystem; major versions apart.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images in the Dockerfile (Node, Go, Alpine).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node moves between major (LTS) versions on purpose, together with CI.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
