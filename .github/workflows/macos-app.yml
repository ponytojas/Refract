# Builds Refract.app and the Refract.dmg that holds it for macOS, one per architecture, and
# signs, notarizes and staples both when the signing secrets are there. Called by the release workflow (#71); also runs on pull
# requests that touch macos/ (always ad hoc: the signing step is skipped on pull requests) and by hand.
#
# Secrets (names only; how to create them: macos/README.md, "Signing and notarization"):
#   MACOS_CERT_P12_BASE64   the Developer ID Application certificate and its key, a .p12, base64
#   MACOS_CERT_PASSWORD     the password of that .p12
#   MACOS_SIGN_IDENTITY     "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY_P8_BASE64    the App Store Connect API key (.p8), base64
#   NOTARY_KEY_ID           its key id
#   NOTARY_ISSUER_ID        the issuer id
# Updates (#70; macos/README.md, "Updates"):
#   SPARKLE_ED_PRIVATE_KEY            secret: the EdDSA private key that signs the updates (Sparkle's generate_keys -x)
#   REFRACT_SPARKLE_PUBLIC_KEY        repository variable: its public half, baked into the app (SUPublicEDKey)
# A signed build needs both: an app that can't verify updates, or an appcast that no app can verify, is not
# a release. The appcast of each architecture (appcast-<arch>.xml) is built from the final, stapled zip and
# uploaded as the artifact appcast-<arch>, next to Refract-app-<arch>, for the release (#71) to attach.
# Without all six (a fork's pull request, a repository that hasn't set them) the app is built
# signed ad hoc, with a notice: it runs here but Gatekeeper rejects it, so it is never a release.
name: macos-app

on:
  workflow_call:
    inputs:
      version:
        description: "Version for the app (a tag such as v0.3.0); v0.0.0-dev when empty"
        type: string
        default: ""
      require-signed:
        description: "Fail instead of building ad hoc when the signing secrets are missing (a release)"
        type: boolean
        default: false
      tools-artifact:
        description: "Use the tools-darwin-<arch> archive tools.yml built earlier in this run, instead of building one"
        type: boolean
        default: false
    secrets:
      MACOS_CERT_P12_BASE64: { required: false }
      MACOS_CERT_PASSWORD: { required: false }
      MACOS_SIGN_IDENTITY: { required: false }
      NOTARY_KEY_P8_BASE64: { required: false }
      NOTARY_KEY_ID: { required: false }
      NOTARY_ISSUER_ID: { required: false }
      SPARKLE_ED_PRIVATE_KEY: { required: false }
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the app (a tag such as v0.3.0); v0.0.0-dev when empty"
        type: string
        default: ""
  pull_request:
    paths:
      - "macos/**"
      - "Makefile"
      - ".github/workflows/macos-app.yml"
      - "scripts/build-*.sh"
      - "scripts/tools-common.sh"
      - "scripts/make-dmg*.py"
      - "scripts/requirements-dmg.txt"
      - "packaging/tools.lock"

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ inputs.version || 'v0.0.0-dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The version ends up in a make command line: only a tag's characters.
      - name: Check the version
        run: |
          case "$VERSION" in
            v[0-9]*) ;;
            *) echo "::error::version must be a tag such as v0.3.0, got: $VERSION"; exit 1 ;;
          esac
          if printf '%s' "$VERSION" | LC_ALL=C grep -q '[^A-Za-z0-9.+-]'; then
            echo "::error::version may only hold letters, digits, '.', '+' and '-'"; exit 1
          fi

      # The release (#71) signs the archive tools.yml built and smoke-tested in the same run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.tools-artifact
        with:
          name: tools-darwin-${{ matrix.arch }}
          path: tools-archive
      - name: Use the tools archive
        if: inputs.tools-artifact
        run: |
          set -- tools-archive/refract-tools-*-darwin-"$ARCH".tar.gz
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected one tools archive for $ARCH, found: $*"; exit 1; }
          echo "TOOLS_ARCHIVE=$PWD/$1" >> "$GITHUB_ENV"

      - name: Signing secrets
        id: secrets
        env:
          EVENT: ${{ github.event_name }}
          REQUIRE_SIGNED: ${{ inputs.require-signed }}
          CERT: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERT_P12_BASE64 || '' }}
          CERT_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERT_PASSWORD || '' }}
          IDENTITY: ${{ github.event_name != 'pull_request' && secrets.MACOS_SIGN_IDENTITY || '' }}
          NOTARY_KEY: ${{ github.event_name != 'pull_request' && secrets.NOTARY_KEY_P8_BASE64 || '' }}
          NOTARY_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER_ID: ${{ github.event_name != 'pull_request' && secrets.NOTARY_ISSUER_ID || '' }}
          SPARKLE_PRIVATE: ${{ github.event_name != 'pull_request' && secrets.SPARKLE_ED_PRIVATE_KEY || '' }}
          SPARKLE_PUBLIC: ${{ vars.REFRACT_SPARKLE_PUBLIC_KEY }}
        run: |
          if [ "$REQUIRE_SIGNED" = true ] && { [ "$EVENT" = pull_request ] || [ -z "$CERT" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$IDENTITY" ] || [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ]; }; then
            echo "::error title=macOS app cannot be signed::A signed build was required, but the signing secrets are not all available (see macos/README.md)."
            exit 1
          elif [ "$EVENT" = pull_request ]; then
            echo "::notice title=macOS app is not signed::Pull requests build the app signed ad hoc: the signing steps never run for them."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CERT" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$IDENTITY" ] || [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ]; then
            echo "::notice title=macOS app is not signed::The signing secrets are not available here (see macos/README.md), so the app is built signed ad hoc and is not notarized. Gatekeeper will reject it: do not publish it."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SPARKLE_PRIVATE" ] || [ -z "$SPARKLE_PUBLIC" ]; then
            echo "::error title=No update key::A signed app must be updatable: set the secret SPARKLE_ED_PRIVATE_KEY and the repository variable REFRACT_SPARKLE_PUBLIC_KEY (macos/README.md, \"Updates\")."
            exit 1
          else
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi

      # A keychain of its own for this job, with a random password nobody sees, deleted at the end.
      - name: Import the signing certificate
        if: steps.secrets.outputs.sign == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set +x
          umask 077
          KEYCHAIN="$RUNNER_TEMP/refract-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Lets codesign use the key without a prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046  # the current list, one path per word, quotes dropped
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "REFRACT_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write the notarization key
        if: steps.secrets.outputs.sign == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set +x
          umask 077
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "REFRACT_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and staple
        if: steps.secrets.outputs.sign == 'true'
        env:
          REFRACT_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          # Well under the job's 90 minutes, which also cover the build: on a stuck submission
          # the script gives up in time to print its id.
          REFRACT_NOTARY_TIMEOUT: 45m
          REFRACT_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          REFRACT_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          REFRACT_SPARKLE_PUBLIC_KEY: ${{ vars.REFRACT_SPARKLE_PUBLIC_KEY }}
        run: make mac-release MAC_ARCH="$ARCH" MAC_VERSION="$VERSION"

      - name: Build (ad hoc)
        if: steps.secrets.outputs.sign != 'true'
        run: |
          make mac MAC_ARCH="$ARCH" MAC_VERSION="$VERSION"
          ditto -c -k --norsrc --noextattr --noqtn --keepParent "build/mac/$ARCH/Refract.app" "build/mac/$ARCH/Refract-$ARCH.zip"

      # What people would download: the zip, unpacked in a fresh folder, must still verify
      # (a zip that drops a symlink or a ticket would show here), and run its tools.
      - name: Check the zip
        shell: bash
        env:
          SIGNED: ${{ steps.secrets.outputs.sign }}
        run: |
          rm -rf check && mkdir check
          # No ._ entries: Finder would unpack those on symbolic links as files and break the seal.
          if zipinfo -1 "build/mac/$ARCH/Refract-$ARCH.zip" | grep -E '(^|/)\._'; then
            echo "::error::the zip carries ._ metadata entries"; exit 1
          fi
          # unzip, not ditto: it unpacks like a plain extractor, without merging metadata back.
          unzip -q "build/mac/$ARCH/Refract-$ARCH.zip" -d check
          if [ "$SIGNED" = true ]; then
            macos/verify-app.sh --release check/Refract.app
            xcrun stapler validate check/Refract.app
            spctl --assess --type execute -vv check/Refract.app
          else
            macos/verify-app.sh check/Refract.app
          fi
          L=check/Refract.app/Contents/Resources/Server/libexec/refract
          "$L/git/bin/git" --version
          "$L/tectonic" --version
          "$L/rg" --version
          "$L/synctex" help 2>&1 | grep -q SyncTeX   # exits non-zero on some builds, so check its banner
          check/Refract.app/Contents/Resources/Server/bin/refract version

      # The disk image people download (#128): the app, a link to Applications, a designed window.
      # dmgbuild writes the window's layout itself, so no Finder session is needed. Signed
      # builds sign and notarize the image too (macos/build-dmg.sh), with the same secrets.
      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-venv"
          "$RUNNER_TEMP/dmg-venv/bin/pip" install --quiet --require-hashes -r scripts/requirements-dmg.txt

      - name: Build the disk image
        env:
          REFRACT_PYTHON: ${{ runner.temp }}/dmg-venv/bin/python
          REFRACT_SIGN_IDENTITY: ${{ steps.secrets.outputs.sign == 'true' && secrets.MACOS_SIGN_IDENTITY || '-' }}
          REFRACT_NOTARY_TIMEOUT: 45m
          REFRACT_NOTARY_KEY_ID: ${{ steps.secrets.outputs.sign == 'true' && secrets.NOTARY_KEY_ID || '' }}
          REFRACT_NOTARY_ISSUER: ${{ steps.secrets.outputs.sign == 'true' && secrets.NOTARY_ISSUER_ID || '' }}
        run: macos/build-dmg.sh "build/mac/$ARCH/Refract.app" "build/mac/$ARCH/Refract-$ARCH.dmg"

      # The image, mounted the way people will: the app in it must verify, and a signed one
      # must pass Gatekeeper as a download would.
      - name: Check the disk image
        shell: bash
        env:
          SIGNED: ${{ steps.secrets.outputs.sign }}
        run: |
          dmg="build/mac/$ARCH/Refract-$ARCH.dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          trap 'hdiutil detach "$mnt" > /dev/null || true' EXIT
          test -L "$mnt/Applications"
          test -f "$mnt/.DS_Store" && test -f "$mnt/.background.tiff"
          if [ "$SIGNED" = true ]; then
            macos/verify-app.sh --release "$mnt/Refract.app"
            xcrun stapler validate "$dmg"
          else
            macos/verify-app.sh "$mnt/Refract.app"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.secrets.outputs.sign == 'true' && 'Refract-dmg' || 'Refract-dmg-adhoc' }}-${{ matrix.arch }}
          path: build/mac/${{ matrix.arch }}/Refract-${{ matrix.arch }}.dmg
      # The appcast of this architecture, signed with the update key from the final zip. A development
      # version (v0.0.0-dev) or a prerelease tag gets none: the script says so and writes no file.
      - name: Appcast
        if: steps.secrets.outputs.sign == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: python3 -I scripts/make-appcast.py --version "$VERSION" --arch "$ARCH" --archive "build/mac/$ARCH/Refract-$ARCH.zip" --output "build/mac/$ARCH/appcast-$ARCH.xml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: hashFiles(format('build/mac/{0}/appcast-{0}.xml', matrix.arch)) != ''
        with:
          name: appcast-${{ matrix.arch }}
          path: build/mac/${{ matrix.arch }}/appcast-${{ matrix.arch }}.xml
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.secrets.outputs.sign == 'true' && 'Refract-app' || 'Refract-app-adhoc' }}-${{ matrix.arch }}
          path: build/mac/${{ matrix.arch }}/Refract-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Remove the keychain and keys
        if: always()
        run: |
          if [ -n "${REFRACT_KEYCHAIN:-}" ]; then security delete-keychain "$REFRACT_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary-key.p8"
