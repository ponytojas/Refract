# Tests every push to main and every pull request: Go (with the race
# detector), the web app, and the browser tests against the real binary.
# Pull requests from forks run with a read-only token and no secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The TeX bundle pinned in the image, and where Tectonic caches what it downloads from it.
  REFRACT_TECTONIC_BUNDLE: https://data1b.fullyjustified.net/tlextras-2022.0r0.tar
  TECTONIC_CACHE_DIR: ${{ github.workspace }}/.tectonic-cache

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Without them the compile and SyncTeX tests skip themselves; install the image's versions.
      - name: Tectonic and synctex
        run: |
          scripts/install-tex-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The sandbox tests need bubblewrap and unprivileged user namespaces, which
      # Ubuntu's runners restrict through AppArmor. REFRACT_TEST_SANDBOX=1 makes
      # a missing tool fail those tests instead of skipping them.
      - name: Bubblewrap
        run: |
          sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / -- true
          echo "REFRACT_TEST_SANDBOX=1" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.TECTONIC_CACHE_DIR }}
          key: tectonic-tlextras-2022.0r0-${{ github.run_id }}
          restore-keys: tectonic-tlextras-2022.0r0-

      - name: Web dependencies
        run: npm ci
        working-directory: web

      - name: Packaging
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Go
        run: |
          go vet ./...
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
          go test -race ./...

      - name: Web
        working-directory: web
        run: |
          npx oxfmt --check .
          npx oxlint src e2e
          npx tsc --noEmit
          node --test src/*.test.ts src/lib/*.test.ts

      # Every spec runs in Chrome and in WebKit, the engine of the macOS app's WKWebView.
      # Playwright's WebKit build runs on Linux, which is enough to catch engine differences
      # (layout, events, APIs) and keeps one job; WKWebView itself is tested separately (#66).
      - name: WebKit
        run: npx playwright install --with-deps webkit
        working-directory: web

      - name: Browser tests
        run: make e2e BROWSER=all

      - name: Browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: web/test-results
          if-no-files-found: ignore

  # Windows has no openat: build outputs are opened with checks that the file
  # and folder opened are the ones checked. Run those tests where they apply.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Confined build outputs
        run: |
          go test ./internal/compile/ -run 'OpenOutput|ReadsThroughChecked' -v
          go test ./cmd/refract/ -run 'OutputDownloads' -v
      - name: One local instance per data folder
        run: go test ./cmd/refract/ -run 'SecondLocal|LocalStartsAfterKill|LocalDifferentFolders|LocalLock|LocalCheck|LocalStatus|LocalWaits|LocalGivesUp' -v
      - name: Local secret key
        run: go test ./cmd/refract/ -run 'ResolveLocalKey' -v
