# When a version tag is pushed: builds the refract binary (server and
# `refract login`) for every platform and publishes them as a GitHub release,
# and publishes the Docker image (amd64 and arm64) to GitHub Container Registry.
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The web UI is embedded in the binary, so the same file runs the server.
      - run: npm ci && npm run build
        working-directory: web
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name=refract-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}
          exe=refract; [ "$GOOS" = windows ] && exe=refract.exe
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/$exe" ./cmd/refract
          cp README.md "dist/$name/"
          cp LICENSE "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
      - name: Debian package
        if: matrix.goos == 'linux'
        run: sh scripts/package-deb.sh "$GITHUB_REF_NAME" '${{ matrix.goarch }}' 'dist/refract-${{ github.ref_name }}-linux-${{ matrix.goarch }}/refract' dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.*z*
            dist/*.deb

  metadata:
    needs: [build, macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '!*.dockerbuild'
          merge-multiple: true
      # The cask (refract-app) is generated from the signed disk images macos-app built in this run.
      - name: Homebrew and WinGet
        run: |
          python3 scripts/package-metadata.py "$GITHUB_REF_NAME" dist "$RUNNER_TEMP/packages"
          cp "$RUNNER_TEMP/packages/homebrew/refract.rb" dist/refract.rb
          cp "$RUNNER_TEMP/packages/homebrew/refract-app.rb" dist/refract-app.rb
          tar -czf dist/refract-winget-manifests.tar.gz -C "$RUNNER_TEMP/packages/winget" manifests
      - uses: actions/upload-artifact@v7
        with:
          name: package-metadata
          path: |
            dist/refract.rb
            dist/refract-app.rb
            dist/refract-winget-manifests.tar.gz

  # Tool archives (Tectonic, SyncTeX, ripgrep, private Git) for every target, built
  # from packaging/tools.lock and smoke-tested on each system; see tools.yml.
  tools:
    uses: ./.github/workflows/tools.yml
    with:
      tag: ${{ github.ref_name }}

  # The macOS app (#71): Refract.app with the tool archives above, signed, notarized and stapled,
  # its disk image (Refract-<arch>.dmg, the download people use) and the update archive and feed
  # (Refract-<arch>.zip, appcast-<arch>.xml). A release never ships an app signed ad hoc: without
  # the signing secrets, or if signing or notarization fails, this job fails and nothing is published.
  macos-app:
    needs: tools
    uses: ./.github/workflows/macos-app.yml
    with:
      version: ${{ github.ref_name }}
      require-signed: true
      tools-artifact: true
    secrets:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

  # Exercise the CLI without any server configuration or LaTeX tools. OAuth
  # itself is interactive; --help checks the login entry point without signing in.
  cli-smoke:
    needs: build
    strategy:
      matrix:
        include:
          - { runner: macos-15, goos: darwin, goarch: arm64 }
          - { runner: ubuntu-latest, goos: linux, goarch: amd64 }
          - { runner: windows-latest, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - name: CLI commands
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd dist
          name="refract-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          exe=refract
          if [ "$GOOS" = windows ]; then
            unzip -q "$name.zip"
            exe=refract.exe
          else
            tar -xzf "$name.tar.gz"
          fi
          test "$("./$name/$exe" version)" = "refract $GITHUB_REF_NAME"
          "./$name/$exe" --help
          "./$name/$exe" login --help
          if [ "$GOOS" = linux ]; then
            sudo dpkg -i ./*.deb
            test "$(refract version)" = "refract $GITHUB_REF_NAME"
            refract login --help
          fi

  # Waits for the image's scan, so a blocked image stops the whole release,
  # and attaches each architecture's scan report.
  release:
    needs: [build, metadata, cli-smoke, tools, macos-app, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # for CHANGELOG.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '!*.dockerbuild'
          merge-multiple: true
      # A release lacking a required tool or licence in any archive stops here;
      # the targets without an archive are listed in the attached gaps file.
      - name: Check the tool archives
        run: |
          python3 -I scripts/tools-archive.py release dist "$GITHUB_REF_NAME"
          python3 -I scripts/tools-archive.py gaps "$GITHUB_REF_NAME" > "dist/refract-tools-${GITHUB_REF_NAME}-gaps.txt"
      # The macOS app's update feeds (macos-app.yml, #70), when this release has them: one per
      # architecture, each pointing at an archive this release attaches. A feed that points anywhere
      # else would send people's apps to the wrong file, so it stops here. Feeds are looked up at
      # releases/latest/download/appcast-<arch>.xml: publish them as assets of a full (not pre-)release.
      # A full release must carry both feeds (checked below); a prerelease has none.
      - name: Check the appcasts
        run: |
          set -- dist/appcast-*.xml
          if [ ! -e "$1" ]; then
            # Installed apps read releases/latest/download/appcast-<arch>.xml: a full release without
            # them would become "latest" and break every installed app's feed (404). Only a
            # prerelease (a '-' in the tag) goes without.
            case "$GITHUB_REF_NAME" in
              *-*) echo "no appcasts in this prerelease"; exit 0 ;;
            esac
            echo "::error::this release attaches the macOS app but no appcast-<arch>.xml: as the latest release it would break every installed app's update feed"; exit 1
          fi
          for arch in arm64 amd64; do
            [ -f "dist/appcast-$arch.xml" ] || { echo "::error::appcast-$arch.xml is missing: an app of that architecture could never update"; exit 1; }
          done
          for f in "$@"; do
            url=$(sed -n 's/.*<enclosure url="\([^"]*\)".*/\1/p' "$f")
            case "$url" in
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"*) ;;
              *) echo "::error::$f points at $url, not at this release"; exit 1 ;;
            esac
            [ -f "dist/${url##*/}" ] || { echo "::error::$f names ${url##*/}, which this release does not attach"; exit 1; }
            arch=${f##*/appcast-}; arch=${arch%.xml}
            case "${url##*/}" in
              *"-$arch.zip") ;;
              *) echo "::error::$f points at ${url##*/}, an archive of another architecture"; exit 1 ;;
            esac
          done
      # Every release carries the macOS app: its disk image (what people download), and the zip
      # the update feeds point at, for both architectures.
      - name: Check the macOS app
        run: |
          for arch in arm64 amd64; do
            for f in "Refract-$arch.dmg" "Refract-$arch.zip"; do
              [ -f "dist/$f" ] || { echo "::error::$f is missing from this release"; exit 1; }
            done
          done
      # The notes are the version's section of CHANGELOG.md ("## [0.1.0] - …"),
      # minus the link definitions at the end of the file. Without that
      # section, GitHub lists the commits instead.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$RUNNER_TEMP/notes.md"
          awk -v head="## [${GITHUB_REF_NAME#v}]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on && !/^\[[^]]*\]: / { print }' CHANGELOG.md > "$notes_file"
          if [ -s "$notes_file" ]; then notes="--notes-file=$notes_file"; else notes="--generate-notes"; fi
          cd dist
          sha256sum * > SHA256SUMS
          # A prerelease (a '-' in the tag) may carry no appcasts: keep it out of releases/latest,
          # where installed apps look for their feeds.
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; *) pre="" ;; esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "$notes" $pre

  # The default token cannot write to a different repository. Opt in after
  # adding a fine-grained HOMEBREW_TAP_TOKEN for Use-Refract/homebrew-tap.
  homebrew:
    needs: release
    if: vars.HOMEBREW_TAP_ENABLED == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package-metadata
          path: metadata
      - uses: actions/checkout@v7
        with:
          repository: Use-Refract/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update tap
        working-directory: tap
        run: |
          mkdir -p Formula Casks
          cp ../metadata/refract.rb Formula/refract.rb
          cp ../metadata/refract-app.rb Casks/refract-app.rb
          if git diff --quiet -- Formula Casks && [ -z "$(git ls-files --others --exclude-standard Formula Casks)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/refract.rb Casks/refract-app.rb
          git commit -m "Refract $GITHUB_REF_NAME"
          git push

  # Each architecture on its own runner: build, smoke test, push by digest
  # (no public tag yet), then scan exactly what was pushed. The public tags
  # move only once every architecture passed (image-publish). A blocked scan
  # leaves only an untagged digest behind.
  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest-amd64: ${{ steps.digest.outputs.amd64 }}
      digest-arm64: ${{ steps.digest.outputs.arm64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Test the image before anyone can pull it: tools, a compile, SyncTeX, the server.
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: refract:smoke
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Smoke test
        run: scripts/smoke-docker.sh refract:smoke linux/${{ matrix.arch }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ponytojas/refract
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/ponytojas/refract,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - id: digest
        run: echo "${{ matrix.arch }}=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: Scanners
        run: |
          scripts/install-scanners.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Blocks the release on Critical findings without a reviewed exception
      # (security/image-scan-exceptions.json); the report is kept either way.
      - name: Scan the pushed image
        run: scripts/scan-image.sh "ghcr.io/ponytojas/refract@${{ steps.push.outputs.digest }}" "$RUNNER_TEMP/scan"
      - name: Keep the report with the build
        if: ${{ !cancelled() && steps.push.outputs.digest != '' }}
        run: |
          printf '%s\n' "ghcr.io/ponytojas/refract@${{ steps.push.outputs.digest }}" > "$RUNNER_TEMP/scan/image.txt"
          tar -czf "$RUNNER_TEMP/refract-image-${GITHUB_REF_NAME}-${{ matrix.arch }}-scan.tar.gz" -C "$RUNNER_TEMP/scan" .
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.push.outputs.digest != '' }}
        with:
          name: image-scan-${{ matrix.arch }}
          path: ${{ runner.temp }}/refract-image-*-scan.tar.gz
          retention-days: 90

  # The public tags point at the digests that passed: both architectures in one list.
  image-publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ponytojas/refract
          # v1.2.3 → 1.2.3 and 1.2; "latest" only for releases, not pre-releases (v1.2.3-rc1).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Tag the scanned digests
        env:
          AMD64: ${{ needs.image.outputs.digest-amd64 }}
          ARM64: ${{ needs.image.outputs.digest-arm64 }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test -n "$AMD64" && test -n "$ARM64"
          set --
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then set -- "$@" -t "$tag"; fi
          done <<EOF
          $TAGS
          EOF
          docker buildx imagetools create "$@" "ghcr.io/ponytojas/refract@$AMD64" "ghcr.io/ponytojas/refract@$ARM64"
          docker buildx imagetools inspect "$(printf '%s\n' "$TAGS" | head -1)"
