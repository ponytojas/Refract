# When a version tag is pushed: builds the refract binary (server and
# `refract login`) for every platform and publishes them as a GitHub release,
# and publishes the Docker image (amd64 and arm64) to GitHub Container Registry.
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The web UI is embedded in the binary, so the same file runs the server.
      - run: npm ci && npm run build
        working-directory: web
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name=refract-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}
          exe=refract; [ "$GOOS" = windows ] && exe=refract.exe
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/$exe" ./cmd/refract
          cp README.md "dist/$name/"
          cp LICENSE "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
      - name: Debian package
        if: matrix.goos == 'linux'
        run: sh scripts/package-deb.sh "$GITHUB_REF_NAME" '${{ matrix.goarch }}' 'dist/refract-${{ github.ref_name }}-linux-${{ matrix.goarch }}/refract' dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.*z*
            dist/*.deb

  metadata:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '!*.dockerbuild'
          merge-multiple: true
      - name: Homebrew and WinGet
        run: |
          python3 scripts/package-metadata.py "$GITHUB_REF_NAME" dist "$RUNNER_TEMP/packages"
          cp "$RUNNER_TEMP/packages/homebrew/refract.rb" dist/refract.rb
          tar -czf dist/refract-winget-manifests.tar.gz -C "$RUNNER_TEMP/packages/winget" manifests
      - uses: actions/upload-artifact@v7
        with:
          name: package-metadata
          path: |
            dist/refract.rb
            dist/refract-winget-manifests.tar.gz

  # Exercise the CLI without any server configuration or LaTeX tools. OAuth
  # itself is interactive; --help checks the login entry point without signing in.
  cli-smoke:
    needs: build
    strategy:
      matrix:
        include:
          - { runner: macos-15, goos: darwin, goarch: arm64 }
          - { runner: ubuntu-latest, goos: linux, goarch: amd64 }
          - { runner: windows-latest, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - name: CLI commands
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd dist
          name="refract-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          exe=refract
          if [ "$GOOS" = windows ]; then
            unzip -q "$name.zip"
            exe=refract.exe
          else
            tar -xzf "$name.tar.gz"
          fi
          test "$("./$name/$exe" version)" = "refract $GITHUB_REF_NAME"
          "./$name/$exe" --help
          "./$name/$exe" login --help
          if [ "$GOOS" = linux ]; then
            sudo dpkg -i ./*.deb
            test "$(refract version)" = "refract $GITHUB_REF_NAME"
            refract login --help
          fi

  release:
    needs: [build, metadata, cli-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # for CHANGELOG.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '!*.dockerbuild'
          merge-multiple: true
      # The notes are the version's section of CHANGELOG.md ("## [0.1.0] - …"),
      # minus the link definitions at the end of the file. Without that
      # section, GitHub lists the commits instead.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$RUNNER_TEMP/notes.md"
          awk -v head="## [${GITHUB_REF_NAME#v}]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on && !/^\[[^]]*\]: / { print }' CHANGELOG.md > "$notes_file"
          if [ -s "$notes_file" ]; then notes="--notes-file=$notes_file"; else notes="--generate-notes"; fi
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "$notes"

  # The default token cannot write to a different repository. Opt in after
  # adding a fine-grained HOMEBREW_TAP_TOKEN for ponytojas/homebrew-tap.
  homebrew:
    needs: release
    if: vars.HOMEBREW_TAP_ENABLED == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package-metadata
          path: metadata
      - uses: actions/checkout@v7
        with:
          repository: ponytojas/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update tap
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../metadata/refract.rb Formula/refract.rb
          if git diff --quiet -- Formula/refract.rb && [ -z "$(git ls-files --others --exclude-standard Formula/refract.rb)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/refract.rb
          git commit -m "Refract $GITHUB_REF_NAME"
          git push

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Test the image before anyone can pull it: tools, a compile, SyncTeX, the server.
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: refract:smoke
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/smoke-docker.sh refract:smoke linux/amd64
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ponytojas/refract
          # v1.2.3 → 1.2.3 and 1.2; "latest" only for releases, not pre-releases (v1.2.3-rc1).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
