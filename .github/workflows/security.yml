# Known vulnerabilities in what Refract uses: Go modules whose vulnerable code
# Refract actually calls (govulncheck), the npm packages the web app ships,
# and the container image people install (the same gate a release passes,
# without publishing anything). Also weekly, since new advisories appear
# without any change here.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Go modules and standard library
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: npm packages in the web app
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate

  # The release's publication gate on an image built here and never pushed:
  # scripts/scan-image.sh blocks on Critical findings without a reviewed
  # exception. The report is kept as an artifact either way.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: refract:scan
          cache-from: type=gha,scope=image-amd64
      - name: Scanners
        run: |
          scripts/install-scanners.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Publication gate
        run: scripts/scan-image.sh refract:scan "$RUNNER_TEMP/scan"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: image-scan
          path: ${{ runner.temp }}/scan
          retention-days: 30
